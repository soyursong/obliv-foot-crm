# ─────────────────────────────────────────────────────────────────────────────
# Auth email templates (version-controlled SSOT)
#
# T-20260729-foot-PWRESET-EMAIL-LINK-BLOCKED-DANGEROUS (P1):
#   비번재설정 메일의 '비밀번호 재설정'이 클릭 불가 단순 텍스트로 렌더(현장 스샷 F0BLA8KREFM).
#   진단 결과 H2(anchor 미포함)=DISCONFIRMED — 원본 recovery template 이미 anchor 보유.
#   실 증상 RC = 수신측 클라이언트 text/plain 렌더 / 링크 flatten. 방어 처방으로 recovery
#   template 을 하드닝(anchor 버튼 유지 + 원본 URL 가시 fallback + Korean 로컬라이즈)하고
#   dashboard-only 였던 template 을 repo 로 version-control(SSOT·rollback base).
#   ※실제 prod 반영은 Management API PATCH(mailer_templates_recovery_content/subject)로 수행됨.
#     롤백 = evidence/.../AC6-original-recovery-template-ROLLBACK-BASE.json 의 원본 content 복원.
# ─────────────────────────────────────────────────────────────────────────────
[auth.email.template.recovery]
subject = "[오블리브 풋케어] 비밀번호 재설정 안내"
content_path = "./supabase/templates/recovery.html"

# ─────────────────────────────────────────────────────────────────────────────
# Edge Function 게이트웨이 설정
#
# T-20260629-foot-INGEST-EF-401-VERIFYJWT (P0 hotfix):
#   도파민 outbound POST는 X-Callback-Secret(=DOPAMINE_CALLBACK_SECRET) 헤더로
#   인증한다(Supabase JWT 아님). 게이트웨이 기본값 verify_jwt=true 가 EF 코드
#   도달 전 'Missing authorization header'(401)로 거부 → 풋 예약 prod 저장 매번 실패.
#   verify_jwt=false 로 게이트웨이 JWT 검사를 끄고, 인증은 EF 코드 내부
#   X-Callback-Secret 검증(index.ts §AC-2, secret 불일치/누락 → 401 UNAUTHORIZED)에
#   위임한다. → 게이트웨이 우회로 secret 검증이 인증의 단일 관문이 되므로 unauth hole 없음.
# ─────────────────────────────────────────────────────────────────────────────
# T-20260731-foot-FOOTQST-PHOTO-UPLOAD (DA CONSULT-REPLY MSG-20260731-135832-y3x7, Pattern B):
#   발건강질문지 고객(anon)이 사진 업로드용 signed URL 을 발급받는 EF. anon 은 anon key(apikey)만 실어
#   호출하고 실 인증은 EF 내부 health_q_tokens 검증(used_at NULL + 미만료)에 위임한다. anon 에 Storage
#   버킷 INSERT 직접 GRANT 를 주지 않기 위한 정본 관문 → 게이트웨이 JWT 검사 대신 token 검증이 단일 게이트.
[functions.health-q-photo-sign]
verify_jwt = false

[functions.reservation-ingest-from-dopamine]
verify_jwt = false

# T-20260714-dopamine-FOOT-PREVCALL-VISITCONFIRM-SYNC-RENAME (reopen / runtime-plumbing fix):
#   dopamine-visitcall-receiver 는 도파민 TM 내원콜 결과(reachable/absent) push 를 X-Callback-Secret
#   (=DOPAMINE_CALLBACK_SECRET) 헤더로 인증한다(Supabase JWT 아님). 게이트웨이 기본 verify_jwt=true 면
#   EF 코드 도달 전 401(Missing authorization header) → '내원콜 방문확인' sync 매번 실패.
#   verify_jwt=false 로 게이트웨이 JWT 검사를 끄고 인증은 EF 내부 X-Callback-Secret 검증(index.ts §Auth,
#   secret 불일치/누락 → 401 UNAUTHORIZED)에 위임 → secret 검증이 인증 단일 관문이므로 unauth hole 없음
#   (reservation-ingest-from-dopamine 동일 컨벤션). ※원커밋 a00ed33a 에서 본 config 등록+실배포 둘 다 누락됨.
[functions.dopamine-visitcall-receiver]
verify_jwt = false

# T-20260708-foot-REDPAY-CLOSING-TAB (activation_gate):
#   redpay-reconcile 는 pg_cron(trigger_redpay_reconcile → net.http_post)이 X-Internal-Cron
#   헤더만 실어 호출한다(Supabase JWT 아님). 게이트웨이 기본 verify_jwt=true 면 EF 코드 도달
#   전 401 → 5분 폴러가 매번 거부되어 실 적재 불가. verify_jwt=false 로 게이트웨이 JWT 검사를
#   끄고 인증은 EF 내부(index.ts:121-123 X-Internal-Cron==INTERNAL_CRON_SECRET 또는
#   service_role Bearer)에 위임한다. 둘 다 불일치 → 401 이므로 unauth hole 없음.
[functions.redpay-reconcile]
verify_jwt = false

# T-20260618-foot-STAFF-ATTENDANCE-SSOT-CRM:
#   attendance-sync 는 pg_cron(trigger_attendance_sync → net.http_post)이 X-Internal-Cron
#   헤더만 실어 호출한다(Supabase JWT 아님). 게이트웨이 기본 verify_jwt=true 면 EF 코드 도달
#   전 401(UNAUTHORIZED_NO_AUTH_HEADER) → 15분 폴러가 매번 거부되어 staff_attendance 미적재
#   (실측 확인: DEPLOY-GO 집행 중 header-only 호출 401). verify_jwt=false 로 게이트웨이 JWT
#   검사를 끄고 인증은 EF 내부(index.ts: CRON_SECRET 있으면 X-Internal-Cron==CRON_SECRET,
#   불일치/누락 → 401)에 위임 → secret 검증이 인증의 단일 관문이므로 unauth hole 없음
#   (redpay-reconcile / reservation-ingest-from-dopamine 동일 컨벤션).
[functions.attendance-sync]
verify_jwt = false

# T-20260802-foot-ATTENDANCE-QR-PORT (선결 게이트 · 설계 §4-5):
#   attendance-otp 는 직원 폰(비로그인)에서 셀프 punch(action=send/verify/enroll_*/punch_device)를
#   받는 공개 EF 다. 게이트웨이 기본 verify_jwt=true 면 EF 코드 도달 前 401 → 비로그인 punch 전량 거부
#   (scalp2 cron paused verify_jwt 401 공회전 동일 함정). verify_jwt=false 로 게이트웨이 JWT 검사를
#   끄고, 인증은 EF 코드 내부(qr_token=kiosk_token Vault 대조 OR admin JWT / punch=QR 토큰 신선도 +
#   OTP·device_token hash 대조)로 강제한다. staff.phone SELECT·OTP·punch write 는 service_role 단일창구.
[functions.attendance-otp]
verify_jwt = false

# T-20260718-foot-CLOSING-HERALD-PORT-GOLDEN (shadow apply):
#   closing-confirmed-publisher 는 pg_cron worker(process_closing_confirmed_outbox → net.http_post)가
#   X-Internal-Cron 헤더(=vault internal_cron_secret)만 실어 호출한다(Supabase JWT 아님). 게이트웨이
#   기본 verify_jwt=true 면 EF 코드 도달 전 401 → 워커가 매번 거부되어 outbox pending→sent 전이 불가.
#   verify_jwt=false 로 게이트웨이 JWT 검사를 끄고 인증은 EF 내부(index.ts: X-Internal-Cron==CRON_SECRET,
#   불일치/누락 → 401)에 위임 → secret 검증이 인증의 단일 관문이므로 unauth hole 없음
#   (attendance-sync / redpay-reconcile / reservation-ingest-from-dopamine 동일 컨벤션).
#   ※첫 배포=shadow(config.mode='shadow', dispatch 0) → 워커가 live-flip 전엔 EF 미호출. live-flip=supervisor 소관.
[functions.closing-confirmed-publisher]
verify_jwt = false

# T-20260722-foot-REDPAY-WEBHOOK-RECV-EF (P1, 최필경 C0ATE5P6JTH · 결제자동화 플랜B):
#   redpay-webhook 은 레드페이 파트너 API 가 X-WEBHOOK-SIGNATURE(=HMAC-SHA256(raw body, secret))
#   헤더로 push 인증한다(Supabase JWT 아님). 게이트웨이 기본 verify_jwt=true 면 EF 코드 도달 전
#   401 → 레드페이 웹훅이 매번 거부되어 결제 push 유실. verify_jwt=false 로 게이트웨이 JWT 검사를
#   끄고 인증은 EF 내부(verify.ts:verifySignature — constant-time HMAC 비교, 불일치 → 401)에 위임 →
#   서명 검증이 인증의 단일 관문이므로 unauth hole 없음(형제 EF 동일 컨벤션).
#   ※PAYMENT_AUTO_MODE(기본 OFF)로 적재 ON/OFF 롤백 가능. OFF 면 검증·2xx 만 하고 적재 skip.
[functions.redpay-webhook]
verify_jwt = false

# T-20260727-foot-REDPAY-PLANB-NOWAIT-PAYPAGE-BUILD (P1, 최필경 C0ATE5P6JTH · 비대기형 결제 매칭/만료 워커):
#   redpay-planb-match 는 pg_cron(trigger_redpay_planb_match → net.http_post)이 X-Internal-Cron
#   헤더(=vault internal_cron_secret)만 실어 1분마다 호출한다(Supabase JWT 아님). 게이트웨이 기본
#   verify_jwt=true 면 EF 코드 도달 전 401 → 워커가 매번 거부되어 pending_payment open 선점의
#   TTL 만료(expired)/웹훅 raw 매칭(matched) 전이 불가. verify_jwt=false 로 게이트웨이 JWT 검사를
#   끄고 인증은 EF 내부(index.ts: X-Internal-Cron==INTERNAL_CRON_SECRET 또는 service_role Bearer,
#   불일치/누락 → 401)에 위임 → secret 검증이 인증의 단일 관문이므로 unauth hole 없음
#   (redpay-reconcile / redpay-webhook / attendance-sync 동일 컨벤션).
[functions.redpay-planb-match]
verify_jwt = false

# T-20260813-foot-SENDNOTIF-VERIFYJWT-REGRESSION (P0 hotfix · 라이브 알림 outage):
#   send-notification 은 pg_cron(notify_reminders_batch / notify_retry_failed / keep_warm_send_notification
#   → net.http_post)이 X-Internal-Cron 헤더(=vault internal_cron_secret)만 실어 호출한다(Supabase JWT 아님).
#   게이트웨이 기본 verify_jwt=true 면 EF 코드 도달 전 401 → 예약 리마인더/확정 알림이 매번 거부되어 미발송.
#   ★사고: config 블록 부재 상태에서 send-notification 이 v43(2026-08-13 06:30Z)로 plain 재배포되며
#     게이트웨이 verify_jwt 가 false→true 로 flip(CLI 기본값) → 06:17Z 이후 전 알림 발송 중단(pending 적체).
#     정상 200 을 받는 형제 cron EF(redpay-reconcile / attendance-sync / closing-confirmed-publisher 등)는
#     전부 verify_jwt=false. send-notification 만 config 미등록으로 재배포 시 true 회귀 = 반복 landmine.
#   verify_jwt=false 로 게이트웨이 JWT 검사를 끄고 인증은 EF 내부(index.ts: X-Internal-Cron==CRON_SECRET,
#   불일치/누락 → 401)에 위임 → secret 검증이 인증의 단일 관문이므로 unauth hole 없음(형제 EF 동일 컨벤션).
#   keep-warm anon ping(T-20260813-KEEPWARM-SENDNOTIF-WARMPING-NON401)은 auth 게이트 이전 200 no-op 이므로
#   verify_jwt=false 와 무충돌.
[functions.send-notification]
verify_jwt = false

# T-20260803-foot-STAFF-PROVISION-ATOMIC-EF-INV6-PORT (P2, body pilot 15d18d00 이식):
#   admin-register-staff 는 직원 계정 등록을 원자화하는 오케스트레이터 EF 다. FE(Accounts.tsx)가
#   현재 로그인 세션의 실제 Supabase JWT(Bearer)를 실어 invoke 하고, EF 는 그 JWT 를
#   admin.auth.getUser(jwt) 로 검증 + user_profiles.role ∈ (admin,manager,director) 게이트 한다.
#   따라서 게이트웨이 기본 verify_jwt=true(진짜 세션 JWT 요구)가 정확히 맞다 — X-…-Secret 계열 EF 와
#   달리 게이트웨이 우회가 필요 없다. 명시적으로 true 를 박아 의도를 문서화(body pilot 동일 컨벤션).
[functions.admin-register-staff]
verify_jwt = true
