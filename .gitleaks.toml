# gitleaks config — obliv-foot-crm secret-scan
# T-20260629-ops-TESTCRED-PLAINTEXT-LIVECRED Stage 3
# 타 CRM 이식 가능: 이 파일 + .github/workflows/secret-scan.yml + scripts/secret-scan.sh 3종을 그대로 복사하면 됨.
title = "obliv-foot-crm secret scan"

# gitleaks 기본 룰셋(API 키/토큰/PEM 등) 상속
[extend]
useDefault = true

# --- 커스텀 룰: 테스트 픽스처 평문 비밀번호 하드코딩 차단 ---
# const PW = '...'; / LOGIN_PASS = "..."; / password = '...'; 등
# process.env / placeholder('...', '<...>', '****') 는 allowlist 로 제외.
[[rules]]
id = "hardcoded-test-password"
description = "Hardcoded plaintext password assignment (use process.env instead)"
regex = '''(?i)(pass(word)?|pwd|\bpw\b|login_pass)\s*[:=]\s*['"][^'"\n]{3,}['"]'''
keywords = ["pass", "pwd", "pw", "login_pass"]

[[rules]]
id = "env-fallback-plaintext-password"
description = "Plaintext password as env fallback (process.env.X || 'pw' / ?? 'pw') — fallback is still a leak"
regex = '''(?i)(pass(word)?|pwd|\bpw\b|login_pass).{0,60}(\|\||\?\?)\s*['"][^'"\n]{3,}['"]'''
keywords = ["||", "??"]

[[rules]]
id = "hardcoded-secret-token"
description = "Hardcoded secret/token/api key assignment"
regex = '''(?i)(secret|token|api[_-]?key|apikey)\s*[:=]\s*['"][^'"\n]{8,}['"]'''
keywords = ["secret", "token", "apikey", "api_key", "api-key"]

# DB 연결 URI 에 평문 비밀번호 임베드 (postgres://user:<PASS>@host) — keyword 인접 'password=' 없어
# hardcoded-test-password 룰이 못 잡던 형태. T-20260629-foot-TESTCRED-FIXTURE-CLEAN Stage C 보강.
# 비밀번호 segment 에 ${ } (템플릿 변수) 가 있으면 env 주입이므로 미탐(char class 가 ${} 배제).
[[rules]]
id = "db-connection-uri-password"
description = "Database connection URI with embedded plaintext password (use env injection)"
regex = '''(?i)postgres(ql)?://[^\s:'"@/]+:[^\s'"@/${}]{3,}@'''
keywords = ["postgres://", "postgresql://"]

# --- pgcrypto/암호화 키 하드코딩 할당 전용 룰 ---
# T-20260818-meta-GITLEAKS-CRYPTOKEY-RULE-ALLOWLIST (CEO MSG-20260818-115050-ym6u ③)
#   기존 커스텀 4룰(hardcoded-test-password / env-fallback / hardcoded-secret-token / db-connection-uri)
#   은 전부 pass|pwd|secret|token|apikey 키워드 기반 → 변수명이 v_key 인 RRN 복호키 할당을 못 잡음.
#   목적 = gate-forward (신규 리터럴 유입 차단). 기존 잔여(마이그 12파일)는 아래 rules.allowlists 로 명시 등재.
#   ④⑤ 결정(T-20260818-meta-RRN-PUBLICREPO-RESIDUAL-RISK-DECISION-RECORD)으로 구키 평문 = 수용된 잔여위험.
[[rules]]
id = "hardcoded-crypto-key-assignment"
description = "Hardcoded pgcrypto/encryption key assigned to a variable (v_key := '...') — use Vault/GUC injection"
regex = '''(?i)\b(v_key|v_old_key|v_key_v[0-9]|enc(ryption)?_key|crypt_key|passphrase)\s*:?=\s*'[^'\n]{8,}''''
keywords = ["v_key", "v_old_key", "enc_key", "encryption_key", "crypt_key", "passphrase"]

  # 기존 27건(마이그 12파일) = ④⑤ 결정으로 수용된 잔여위험. 경로+사유 명시 등재(룰 스코프 한정 —
  # 타 룰의 이 경로 적용은 유지). 신규 마이그 파일에 유입되는 v_key 리터럴은 미등재 → 정상 차단.
  [[rules.allowlists]]
  description = "RRN v1 구키 평문 (수용된 잔여위험, T-20260818-meta-RRN-PUBLICREPO-RESIDUAL-RISK-DECISION-RECORD) — 히스토리 잔존+prod v1 활성 복호키라 HEAD 삭제는 보안조치 아님(③-c 오인 금지)."
  paths = [
    '''^supabase/migrations/20260510000020_rrn_functions_fix\.sql$''',
    '''^supabase/migrations/20260511000010_rrn_functions_hotfix\.sql$''',
    '''^supabase/migrations/20260520000030_rrn_key_harden\.down\.sql$''',
    '''^supabase/migrations/20260613120000_customer_birthdate_derive_rpc\.sql$''',
    '''^supabase/migrations/20260615160000_rls_clinic_isolation_patient_tables\.rollback\.sql$''',
    '''^supabase/migrations/20260615160000_rls_clinic_isolation_patient_tables\.sql$''',
    '''^supabase/migrations/20260618190000_rrn_decrypt_staff_read_restore\.sql\.PHI_GATE_HOLD$''',
    '''^supabase/migrations/20260620120100_rrn_decrypt_a2_role_restore\.sql$''',
    '''^supabase/migrations/20260710170000_rrn_decrypt_version_aware_multikey\.rollback\.sql$''',
    '''^supabase/migrations/20260710170000_rrn_decrypt_version_aware_multikey\.sql$''',
    '''^supabase/migrations/20260710180000_fn_customer_birthdates_version_aware_vault\.rollback\.sql$''',
    '''^supabase/migrations/20260710180000_fn_customer_birthdates_version_aware_vault\.sql$''',
  ]

# --- pgp_sym_encrypt/decrypt 인라인 리터럴 키 (defense-in-depth, 현재 매칭 0) ---
# v_key 변수 경유가 아니라 pgp_sym_decrypt(col, 'literal') 직접 인라인 형태. 현행 0건이나 신규 유입 차단.
[[rules]]
id = "hardcoded-crypto-key-in-pgp-call"
description = "Plaintext key literal passed inline to pgp_sym_encrypt/decrypt()"
regex = '''(?i)pgp_sym_(en|de)crypt\s*\([^,)]+,\s*'[^'\n]{6,}''''
keywords = ["pgp_sym_encrypt", "pgp_sym_decrypt"]

# --- Supabase Personal Access Token (PAT) 전용 룰 ---
# T-20260810-meta-PAT-SECRETSCAN-COVERAGE-HARDEN (부모 T-20260810-meta-ACCOUNTWIDE-PAT-STORAGE-LEAKSCAN-VERIFY AC-2)
# gitleaks 8.30.1 default 룰셋에 Supabase PAT(sbp_…) 전용 룰 부재 실증 → keyword 비인접 bare-paste
# (로그/티켓에 토큰 문자열만 붙여넣기) 미탐 갭. account-wide PAT 1개 = 전 Supabase 프로젝트 권한 →
# 단일 유출 폭발반경 = 전 프로젝트. keyword 를 토큰 prefix 'sbp_' 자체로 두어 bare paste 도 탐지.
[[rules]]
id = "supabase-personal-access-token"
description = "Supabase Personal Access Token (sbp_...)"
regex = '''\bsbp_[A-Za-z0-9]{40}\b'''
keywords = ["sbp_"]

[allowlist]
description = "env 주입·플레이스홀더·필드명·타입속성은 허용"
regexes = [
  '''process\.env''',                       # env 주입 패턴
  '''import\.meta\.env''',                   # vite env
  '''Deno\.env''',                           # edge function env
  '''type\s*=\s*["']password["']''',         # <input type="password">
  '''["']password["']\s*[:,)]''',            # 필드명 리터럴 'password'
  '''[:=]\s*['"](\.{2,}|<[^>]+>|\*{3,}|x{3,}|REPLACE|CHANGE_?ME|placeholder|example|your[_-])['"]''', # 플레이스홀더
  '''\.fill\(''',                            # playwright .fill(pw)
  '''\[AC[0-9-]''',                          # foot e2e 수용기준 로그 마커(console.log("[AC-3] ... PASS: ...")) — status 라벨 오탐 차단
  '''solapi_(secret|api[_-]?key)_[0-9a-f]{6,}''', # Vault 시크릿의 '이름'(포인터 식별자, 실 시크릿 값 아님) — *_vault_name 컬럼/픽스처 오탐 차단 (T-20260731-SENDGATE-DIAG)
  '''\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b''', # 표준 UUID(레코드 식별자: staff_id/check_in_id/payment_id 등) — db-gate 진단 evidence JSON 의 record uuid 오탐 차단. 실 API키/토큰은 8-4-4-4-12 하이픈 구조를 갖지 않음 (T-20260808-HEO4717-2E8F7AA5-CIS-CREATE census)
]
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''\.lock$''',
  '''package-lock\.json$''',
  '''(^|/)i18n(\.|/)''',          # 번역 사전 (UI 라벨 '비밀번호' 등은 자격증명 아님)
  '''(^|/)locales?/''',
]
